<div class="container">
  <div class="page">
    <h1>To Do List</h1>
    <app-todo-input (search)="onSearch($event)" (addTodo)="onAddTodo($event)"></app-todo-input>
    <app-todo-list [todos]="(this.todoService.filteredTodos$ | async) || []" (removeTodo)="onRemoveTodo($event)">
    </app-todo-list>
  </div>
</div>
